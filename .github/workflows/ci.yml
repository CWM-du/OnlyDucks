name: CI

on:
  pull_request:
    branches: [develop, main, feat/dev03-responsive-experience, integration/backend-recovery-from-develop]
  push:
    branches: [develop, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: onlyducks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d onlyducks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/onlyducks
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/onlyducks
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations to clean PostgreSQL
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
