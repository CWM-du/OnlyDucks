name: CI

on:
  pull_request:
    branches: [develop, main, feat/dev03-responsive-experience]
  push:
    branches: [develop, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture npm audit report (temporary diagnostic)
        run: npm audit --json > npm-audit.json || true

      - name: Upload npm audit report (temporary diagnostic)
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
        env:
          # Build-time placeholder only. Never use production credentials in CI.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/onlyducks
