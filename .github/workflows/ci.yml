name: CI

on:
  pull_request:
    branches: [develop, main, feat/dev03-responsive-experience, integration/backend-recovery-from-develop]
  push:
    branches: [develop, main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: onlyducks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d onlyducks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/onlyducks
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/onlyducks
      PLAYWRIGHT_BASE_URL: https://only-ducks-git-feat-onlyducks-th-e081ad-trindadeproduction-9727.vercel.app
      EXPECTED_PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations to clean PostgreSQL
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for current preview to respond
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$PLAYWRIGHT_BASE_URL" | grep -q "$EXPECTED_PREVIEW_COMMIT"; then
              echo "Correct preview commit is responding: $EXPECTED_PREVIEW_COMMIT"
              exit 0
            fi
            echo "Waiting for preview ($attempt/60)..."
            sleep 10
          done
          echo "Preview did not become available in 10 minutes"
          exit 1

      - name: Browser end-to-end tests against preview
        run: npm run test:e2e

      - name: Upload responsive visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onlyducks-visual-review
          path: artifacts/visual/*.png
          if-no-files-found: warn
          retention-days: 14
