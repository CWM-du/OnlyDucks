services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onlyducks
      POSTGRES_PASSWORD: onlyducks_local
      POSTGRES_DB: onlyducks
    ports:
      - "5432:5432"
    volumes:
      - onlyducks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlyducks -d onlyducks"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://onlyducks:onlyducks_local@db:5432/onlyducks?schema=public
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - AI_MODEL_NAME=${AI_MODEL_NAME:-llama-3.3-70b-versatile}
    depends_on:
      db:
        condition: service_healthy

volumes:
  onlyducks_pgdata:
